name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install LLVM tools
        shell: pwsh
        run: |
          choco install llvm --no-progress --yes
          $env:Path = "C:\Program Files\LLVM\bin;$env:Path"
          clang-format --version

      - name: Check formatting
        shell: pwsh
        run: |
          $env:Path = "C:\Program Files\LLVM\bin;$env:Path"
          $files = Get-ChildItem src -Recurse -File -Include *.cpp, *.h
          clang-format --dry-run --Werror $files.FullName

      - name: Install Cppcheck
        shell: pwsh
        run: choco install cppcheck --no-progress --yes

      - name: Run Cppcheck
        shell: pwsh
        run: >-
          cppcheck src
          --enable=warning,style,performance,portability
          --error-exitcode=1
          --inline-suppr
          --std=c++17
          --language=c++
          --suppress=missingIncludeSystem

      - name: Run clang-tidy
        shell: pwsh
        run: |
          $env:Path = "C:\Program Files\LLVM\bin;$env:Path"
          cmake -S . -B build-tidy -G "Visual Studio 17 2022" -A x64 -DCMAKE_CXX_CLANG_TIDY=clang-tidy
          cmake --build build-tidy --config Release --parallel

      - name: Configure x64 build
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: win-clipper-x64
          path: build/Release/win-clipper.exe
