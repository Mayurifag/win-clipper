name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-2022
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install LLVM tools
        shell: pwsh
        run: |
          choco install llvm --no-progress --yes
          $env:Path = "C:\Program Files\LLVM\bin;$env:Path"
          clang-format --version

      - name: Check formatting
        shell: pwsh
        run: |
          $env:Path = "C:\Program Files\LLVM\bin;$env:Path"
          $files = Get-ChildItem src -Recurse -File -Include *.cpp, *.h
          clang-format --dry-run --Werror $files.FullName

      - name: Install Cppcheck
        shell: pwsh
        run: choco install cppcheck --no-progress --yes

      - name: Run Cppcheck
        shell: pwsh
        run: >-
          & "C:\Program Files\Cppcheck\cppcheck.exe" src
          --enable=warning,style,performance,portability
          --error-exitcode=1
          --inline-suppr
          --std=c++17
          --language=c++
          --suppress=missingIncludeSystem

      - name: Run clang-tidy
        shell: pwsh
        run: |
          $env:Path = "C:\Program Files\LLVM\bin;$env:Path"
          cmake -S . -B build-tidy -G "Visual Studio 17 2022" -A x64 -DCMAKE_CXX_CLANG_TIDY=clang-tidy
          cmake --build build-tidy --config Release --parallel

      - name: Configure x64 build
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win-clipper-x64
          path: build/Release/win-clipper.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: win-clipper-x64
          path: release

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$env:GITHUB_REF_NAME" release/win-clipper.exe
          --title "$env:GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
